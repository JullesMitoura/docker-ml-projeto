name: Build/Publish Docker Image PROD

on:
  push:
    branches:
      - prod

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: checkout de codigo
        uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: build da imagem de treino
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.train
          tags: docker-ml-projeto-train
          load: true
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max

      - name: gerar artefato do modelo
        run: docker run -v ${{ github.workspace }}/artifacts:/app/artifacts docker-ml-projeto-train
      
      - name: upload do artefato para Azure Blob Storage
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
              --destination ${{ secrets.AZURE_STORAGE_CONTAINER }} \
              --destination-path prod/run-${{ github.run_number }} \
              --source ${{ github.workspace }}/artifacts \
              --pattern "*.pkl" \
              --overwrite
